<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Картки товарів</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="products" aria-label="Каталог товарів">
            <article class="product-card product-card--featured">
                <div class="product-img">
                    <img src="https://picsum.photos/seed/headphones/900/600" alt="Бездротові навушники">
                    <div class="product-actions">
                        <button class="action-btn" type="button">🛒 В кошик</button>
                    </div>
                </div>
                <div class="product-info">
                    <h2 class="product-name">Бездротові навушники</h2>
                    <p class="product-price">3 499 грн</p>
                </div>
            </article>

            <article class="product-card">
                <div class="product-img">
                    <img src="https://picsum.photos/seed/watch/600/400" alt="Смартгодинник">
                    <div class="product-actions">
                        <button class="action-btn" type="button">🛒 В кошик</button>
                    </div>
                </div>
                <div class="product-info">
                    <h2 class="product-name">Смартгодинник</h2>
                    <p class="product-price">2 799 грн</p>
                </div>
            </article>

            <article class="product-card">
                <div class="product-img">
                    <img src="https://picsum.photos/seed/speaker/600/400" alt="Портативна колонка">
                    <div class="product-actions">
                        <button class="action-btn" type="button">🛒 В кошик</button>
                    </div>
                </div>
                <div class="product-info">
                    <h2 class="product-name">Портативна колонка</h2>
                    <p class="product-price">1 899 грн</p>
                </div>
            </article>

            <article class="product-card">
                <div class="product-img">
                    <img src="https://picsum.photos/seed/camera/600/400" alt="Компактна камера">
                    <div class="product-actions">
                        <button class="action-btn" type="button">🛒 В кошик</button>
                    </div>
                </div>
                <div class="product-info">
                    <h2 class="product-name">Компактна камера</h2>
                    <p class="product-price">4 299 грн</p>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
